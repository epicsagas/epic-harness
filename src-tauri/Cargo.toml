[package]
name = "graphos-desktop"
version = "0.1.0"
edition = "2024"
description = "GraphOS Knowledge Graph Desktop Application"

[lib]
name = "graphos_desktop_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
epic-harness = { path = ".." }
rusqlite = { version = "0.39", features = ["bundled"] }
thiserror = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
