[package]
name = "epic-harness-dashboard"
version = "0.4.0"
edition = "2024"
description = "Epic Harness AI Agent Dashboard"

[lib]
name = "epic_harness_dashboard_lib"
crate-type = ["lib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
epic-harness = { path = ".." }
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
