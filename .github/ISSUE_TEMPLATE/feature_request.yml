name: Feature Request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve epic-harness!

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain point or use case.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you've tried?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Commands (/spec, /go, /check, /ship, /evolve, /orbit)
        - Skills (auto-trigger)
        - Hooks (guard, observe, polish, resume)
        - Memory (harness mem)
        - Integrations (Claude Code, Cursor, etc.)
        - CLI (epic install, telemetry, etc.)
        - Other
    validations:
      required: true
