[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
# Allow dirty (we manage additional jobs in release.yml)
allow-dirty = ["ci"]
macos-sign = false

# NOTE: Linux GTK/WebKit dependencies are installed via explicit apt-get step in release.yml
# cargo-dist truncates 'libwebkit2gtk-4.1-dev' to 'libwebkit2gtk-4' (bug) — do NOT use [dist.dependencies.apt]
# [dist.dependencies.apt] is intentionally omitted; see release.yml 'Install Tauri Linux deps' step
