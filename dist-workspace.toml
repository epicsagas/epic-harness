[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Homebrew tap repository
tap = "epicsagas/homebrew-tap"
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Skip checking whether the specified configuration files are up to date
allow-dirty = ["ci"]
# Whether to sign macOS executables
macos-sign = false
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

[dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"

# NOTE: Linux GTK/WebKit dependencies are installed via explicit apt-get step in release.yml
# cargo-dist truncates 'libwebkit2gtk-4.1-dev' to 'libwebkit2gtk-4' (bug) — do NOT use [dist.dependencies.apt]
# [dist.dependencies.apt] is intentionally omitted; see release.yml 'Install Tauri Linux deps' step
